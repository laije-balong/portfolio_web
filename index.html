<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO — mis à jour dynamiquement par le router pour chaque page -->
  <meta id="meta-desc" name="description"
        content="BALONG Laije Belthassar — Développeur & Formateur en informatique. Projets web, systèmes, APIs et automatisation. Basé à Brazzaville.">
  <meta name="author"  content="BALONG Laije Belthassar">
  <meta name="robots"  content="index, follow">
  <meta name="theme-color" content="#020a14">

  <!-- Open Graph — réseaux sociaux -->
  <meta id="og-title" property="og:title"
        content="GnoLab — Développeur & Formateur en Informatique">
  <meta id="og-desc"  property="og:description"
        content="Construire des systèmes qui fonctionnent. Apprendre aux autres à en faire de même.">
  <meta property="og:type"  content="website">
  <meta property="og:image" content="/assets/images/og-cover.png">
  <meta property="og:url"   content="https://gnolab.dev">

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="GnoLab — Développeur & Formateur">
  <meta name="twitter:description" content="Construire des systèmes qui fonctionnent. Apprendre aux autres à en faire de même.">
  <meta name="twitter:image"       content="/assets/images/og-cover.png">

  <title>GnoLab — Développeur & Formateur en Informatique</title>

  <!-- Canonical -->
  <link id="canonical" rel="canonical" href="https://gnolab.dev">

  <!-- Polices — preconnect avant le stylesheet pour éviter le FOIT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </noscript>

  <!-- Styles (l'ordre est important) -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/particles.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/about.css">
  <link rel="stylesheet" href="/css/gallery.css">
  <link rel="stylesheet" href="/css/mobile.css">
  <link rel="stylesheet" href="/css/polish.css">
</head>
<body>

  <!-- Texture de grain ambiant -->
  <div id="noise-overlay" aria-hidden="true"></div>

  <!-- ── Header fixe ── -->
  <header id="site-header" role="banner">
    <div class="header-inner">

      <!-- Logo cliquable -->
      <div class="header-logo" role="link" tabindex="0"
           aria-label="Accueil GnoLab" id="logo-btn">
        <div class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="1.5">
            <path d="M2 12 L5 5 L8 9 L11 3 L14 8"/>
            <circle cx="14" cy="8" r="1.5" fill="white" stroke="none"/>
          </svg>
        </div>
        <span class="logo-text">GnoLab</span>
      </div>

      <!-- Navigation desktop -->
      <nav class="header-nav" id="header-nav"
           role="navigation" aria-label="Navigation principale">

        <a href="/about"    class="nav-btn" data-link data-route="/about">À propos</a>
        <a href="/projects" class="nav-btn" data-link data-route="/projects">Réalisations</a>
        <a href="/contact"  class="nav-btn" data-link data-route="/contact">Contact</a>
        <a href="/contact"  class="nav-btn nav-btn--cta" data-link data-route="/contact">
          Travailler ensemble
        </a>

        <!-- Bascule thème -->
        <button class="theme-toggle" id="theme-toggle"
                aria-label="Basculer le thème sombre/clair" title="Changer de thème">
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1"  x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22"   x2="5.64"  y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1"  y1="12" x2="3"  y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78"  x2="5.64"  y2="18.36"/>
            <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"/>
          </svg>
        </button>
      </nav>

      <!-- Bouton hamburger (mobile uniquement) -->
      <button class="hamburger" id="hamburger"
              aria-label="Ouvrir le menu" aria-expanded="false"
              aria-controls="menu-mobile">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
    </div><!-- /.header-inner -->
  </header>

  <!-- ── Menu mobile (drawer) ── -->
  <div class="menu-mobile" id="menu-mobile" aria-hidden="true" role="dialog"
       aria-modal="true" aria-label="Menu de navigation">
    <!-- Fond semi-transparent pour fermer -->
    <div class="menu-mobile-backdrop" id="menu-backdrop"></div>

    <!-- Panneau du menu -->
    <nav class="menu-mobile-panel" id="menu-panel">
      <div class="menu-mobile-header">
        <span class="logo-text">GnoLab</span>
        <button class="menu-close" id="menu-close" aria-label="Fermer le menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="menu-mobile-liens">
        <a href="/"        class="menu-lien" data-link data-route="/">Accueil</a>
        <a href="/about"   class="menu-lien" data-link data-route="/about">À propos</a>
        <a href="/projects" class="menu-lien" data-link data-route="/projects">Réalisations</a>
        <a href="/contact" class="menu-lien" data-link data-route="/contact">Contact</a>
      </div>

      <a href="/contact" class="menu-cta" data-link>
        Travailler ensemble →
      </a>

      <!-- Bascule thème dans le menu mobile -->
      <div class="menu-theme-row">
        <span>Thème</span>
        <button class="theme-toggle theme-toggle--small" id="theme-toggle-mobile"
                aria-label="Changer de thème">
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
          </svg>
        </button>
      </div>
    </nav>
  </div>

  <!-- ── Shell principal ── -->
  <div id="app">
    <div id="page-outlet" role="main"></div>

    <!-- ── Footer enrichi ── -->
    <footer class="site-footer" role="contentinfo">
      <div class="footer-inner">

        <!-- Colonne 1 : logo + tagline + socials -->
        <div class="footer-brand">
  x
      
          <!-- Liens sociaux -->
          <div class="footer-socials" aria-label="Réseaux sociaux">
            <!-- GitHub -->
            <a href="https://github.com" target="_blank" rel="noopener noreferrer"
               class="footer-social" aria-label="GitHub">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/>
              </svg>
            </a>
            <!-- LinkedIn -->
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer"
               class="footer-social" aria-label="LinkedIn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
              </svg>
            </a>
            <!-- Email -->
            <a href="/contact" class="footer-social" data-link aria-label="Me contacter">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </a>
          </div>
        </div>

        <!-- Colonne 2 : Navigation -->
        <nav class="footer-nav" aria-label="Navigation footer">
          <h4 class="footer-nav-titre">Navigation</h4>
          <ul class="footer-nav-liste">
            <li><a href="/"        data-link class="footer-lien">Accueil</a></li>
            <li><a href="/projects" data-link class="footer-lien">Réalisations</a></li>
            <li><a href="/about"    data-link class="footer-lien">À propos</a></li>
            <li><a href="/contact"  data-link class="footer-lien">Contact</a></li>
          </ul>
        </nav>
      </div>

      <!-- Barre du bas : copyright -->
      <div class="footer-bottom">
        <span id="footer-copyright">© 2025 GnoLab</span>
        <span class="footer-sep" aria-hidden="true">·</span>
        <span>Tous droits réservés</span>
        <span class="footer-sep" aria-hidden="true">·</span>
        <a href="/contact" data-link class="footer-lien-bas">Travailler ensemble</a>
      </div>
    </footer>
  </div>

  <!-- Cursor dot (amélioration progressive, desktop seulement) -->
  <div class="cursor-dot" id="cursor-dot" aria-hidden="true"></div>

  <!-- Bouton retour en haut -->
  <button id="back-to-top" aria-label="Retour en haut de page" title="Haut de page">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"/>
    </svg>
  </button>

  <!-- Point d'entrée JS (modules ES) -->
  <script type="module" src="/js/app.js"></script>

</body>
</html>
