<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GnoLab — Portfolio Data Analyst. Projets d'analyse de données, modèles prédictifs et visualisations.">
  <meta name="theme-color" content="#0f172a">

  <!-- Open Graph -->
  <meta property="og:title" content="GnoLab">
  <meta property="og:description" content="Transformation de données complexes en décisions éclairées.">
  <meta property="og:type" content="website">

  <title>Portfolio GnoLab</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Styles (order matters) -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/particles.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>

  <!-- Noise texture overlay (ambient grain) -->
  <div id="noise-overlay" aria-hidden="true"></div>

  <!-- Fixed Header -->
  <header id="site-header" role="banner">
    <div class="header-logo" role="link" tabindex="0" aria-label="Accueil GnoLab">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="1.5">
          <path d="M2 12 L5 5 L8 9 L11 3 L14 8"/>
          <circle cx="14" cy="8" r="1.5" fill="white" stroke="none"/>
        </svg>
      </div>
      <span class="logo-text">GnoLab</span>
    </div>

    <nav class="header-nav" role="navigation" aria-label="Navigation principale">
      <button class="nav-btn" data-nav="projects">
        Réalisations
      </button>

      <a href="/contact" class="nav-btn" data-link>
        Contact
      </a>

      <a href="/contact" class="nav-btn nav-btn--cta" data-link>
        Travailler ensemble
      </a>

      <button
        class="theme-toggle"
        id="theme-toggle"
        aria-label="Basculer le thème sombre/clair"
        title="Changer de thème"
      >
        <!-- Moon icon (shown in dark mode) -->
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <!-- Sun icon (shown in light mode) -->
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1"  x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1"  y1="12" x2="3"  y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </nav>
  </header>

  <!-- Main app shell -->
  <div id="app">
    <!-- Router injects pages here -->
    <div id="page-outlet" role="main"></div>

    <!-- Site footer -->
    <footer class="site-footer" role="contentinfo">
      <p>© 2026 GnoLab &mdash;
        <a href="/projects" data-link>Projets</a> ·
        <a href="/contact"  data-link>Contact</a>
      </p>
    </footer>
  </div>

  <!-- Cursor dot (progressive enhancement) -->
  <div class="cursor-dot" id="cursor-dot" aria-hidden="true"></div>

  <!-- Back to top -->
  <button id="back-to-top" aria-label="Retour en haut de page" title="Haut de page">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"/>
    </svg>
  </button>

  <!-- App entry (ES modules) -->
  <script type="module" src="/js/app.js"></script>

</body>
</html>
